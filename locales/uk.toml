# Ukrainian strings for the module's own screen.
#
# `[module]` is read by the *host* for the module card and the tab; everything
# else is read by the module.

[module]
title = "Цей комп'ютер"
description = "Що це за машина — виробник, модель, серійний номер, ОС, процесор, пам'ять, диски, мережа, мікропрограма та захист."

[ui]
title = "Цей комп'ютер"
subtitle = "Що це за машина — виробник, модель, серійний номер, ОС, процесор, пам'ять, диски, мережа, мікропрограма та те, що її захищає. Читається з файлів: жоден процес не запускається, і ніщо не залишає комп'ютер."
scan = "Сканувати"
rescan = "Сканувати ще раз"
report = "Створити звіт"
scan_admin = "Сканувати як адміністратор"
